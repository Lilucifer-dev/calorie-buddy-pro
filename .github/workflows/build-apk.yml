name: Build Calorie Buddy Pro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q Calorie_Buddy_V13_2_Cloud_APK_Build_FIXED.zip -d project
          test -f project/settings.gradle.kts
          test -f project/app/build.gradle.kts

      - name: Patch Android project for AGP 9
        working-directory: project
        run: |
          sed -i '/org\.jetbrains\.kotlin\.android/d' app/build.gradle.kts
          sed -i '/org\.jetbrains\.kotlin\.android/d' build.gradle.kts
          sed -i '/kotlinOptions[[:space:]]*{/,/^[[:space:]]*}/d' app/build.gradle.kts
          rm -f app/src/main/res/drawable/icon-512.png
          rm -f app/src/main/res/drawable/icon-192.png
          rm -f app/src/main/res/values/styles.xml
          echo '--- app/build.gradle.kts ---'
          sed -n '1,80p' app/build.gradle.kts
          echo '--- root build.gradle.kts ---'
          sed -n '1,30p' build.gradle.kts

      - name: Verify Android resources
        working-directory: project
        run: |
          if find app/src/main/res -type f | grep -E '/[^/]*-[^/]*\.(png|xml|jpg|jpeg|webp)$'; then
            echo 'Invalid hyphenated Android resource filename found.'
            exit 1
          fi

      - name: Build Release APK
        working-directory: project
        run: gradle clean assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-buddy-pro-v13.2-apk
          path: project/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
