name: Build Calorie Buddy Pro APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir project
          unzip -q Calorie_Buddy_V13_2_Cloud_APK_Build_FIXED.zip -d project

      - name: Build Release APK
        working-directory: project
        run: gradle clean assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calorie-buddy-pro-v13.2-apk
          path: project/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
